<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Emotion Sphere</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; cursor:grab; }
body.dragging { cursor:grabbing; }
canvas { position:fixed; top:0; left:0; z-index:1; }
/* Subtle holographic scanlines */
body::after {
  content:'';
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent, transparent 2px,
    rgba(255,255,255,0.018) 2px, rgba(255,255,255,0.028) 3px
  );
}
#label { display:none; }
#dots { position:fixed; top:24px; right:24px; z-index:100; display:flex; gap:10px; }
.dot { width:10px; height:10px; border-radius:50%; cursor:pointer; opacity:0.35; transition:all 0.3s; }
.dot:hover,.dot.active { opacity:1; transform:scale(1.5); }
.dot-cycle {
  width:14px; height:14px; border-radius:50%;
  background:conic-gradient(from 90deg,#22b8e8,#c890b0,#E83040,#FFE066,#22b8e8);
  box-shadow:0 0 8px rgba(255,255,255,0.35);
}
#hint { display:none; }

#params-toggle {
  position: fixed;
  left: 24px;
  bottom: 24px;
  z-index: 120;
  appearance: none;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(8,8,12,0.82);
  color: rgba(255,255,255,0.75);
  font: 10px/1 'Courier New', monospace;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}
#params-toggle:hover { color: #a0caef; border-color: rgba(160,202,239,0.35); }

#params-panel {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 280px;
  z-index: 110;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.08);
  background: rgba(8,8,12,0.94);
  padding: 20px 16px 24px;
  transform: translateX(0);
  transition: transform 0.25s ease;
}
#params-panel.hidden { transform: translateX(-100%); pointer-events: none; }
#params-panel h2 {
  font-size: 10px;
  letter-spacing: 3px;
  font-weight: 400;
  color: rgba(160,202,239,0.9);
  text-transform: uppercase;
  margin-bottom: 14px;
}
#params-panel .row {
  display: grid;
  grid-template-columns: 92px 1fr 44px;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: rgba(255,255,255,0.55);
  margin-bottom: 8px;
}
#params-panel .row span { text-transform: lowercase; }
#params-panel .row em {
  font-style: normal;
  text-align: right;
  color: rgba(160,202,239,0.85);
}
#params-panel input[type="range"] {
  width: 100%;
  accent-color: #a0caef;
}
</style>
</head>
<body>
<div id="label">RED · DANGER · AGGRESSION · ALERT</div>
<div id="dots">
  <div class="dot" style="background:#22b8e8;box-shadow:0 0 8px #5ce4ff" onclick="switchEmotion('blue')" id="d-blue"></div>
  <div class="dot" style="background:#FFE066;box-shadow:0 0 8px #FFE880" onclick="switchEmotion('yellow')" id="d-yellow"></div>
  <div class="dot active" style="background:#E83040;box-shadow:0 0 8px #FF5560" onclick="switchEmotion('red')" id="d-red"></div>
  <div class="dot" style="background:#c890b0;box-shadow:0 0 8px #e8b0c8" onclick="switchEmotion('purple')" id="d-purple"></div>
  <div class="dot dot-cycle" onclick="toggleCycle()" id="d-cycle" title="Cycle: blue → purple → red → yellow (click a colour dot to stop)"></div>
</div>
<div id="hint">DRAG TO ROTATE · CYCLE RUNS ALL FOUR · CLICK A DOT TO STOP</div>
<button id="params-toggle" type="button">Params</button>
<aside id="params-panel" class="hidden">
  <h2>Core Particles</h2>
  <div id="params-controls"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="cloud-background.js"></script>
<script>
// Show runtime errors on-screen (helps when the canvas is blank)
(function(){
  const box=document.createElement('div');
  box.id='err';
  box.style.cssText='position:fixed;left:12px;bottom:12px;max-width:46vw;z-index:9999;padding:10px 12px;border:1px solid rgba(255,80,80,0.35);background:rgba(10,0,0,0.65);color:rgba(255,170,170,0.95);font:11px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;white-space:pre-wrap;pointer-events:none;display:none;';
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(box));
  function show(msg){
    box.textContent=msg;
    box.style.display='block';
  }
  window.addEventListener('error',(e)=>show(String(e.message||e.error||e)));
  window.addEventListener('unhandledrejection',(e)=>show('Unhandled promise rejection:\n'+String(e.reason||e)));
})();

function hexRgb(h){
  const n=parseInt(h.slice(1),16);
  return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}
const SILVER=hexRgb('#B8C8DC');

function emotionPalette(cfg){
  const e={...cfg};
  e.shadow=hexRgb(cfg.shadowHex);
  e.deep=hexRgb(cfg.deepHex);
  e.base=hexRgb(cfg.baseHex);
  if(cfg.hotHex) e.hot=hexRgb(cfg.hotHex);
  if(cfg.coreHex) e.core=hexRgb(cfg.coreHex);
  if(cfg.midHex) e.mid=hexRgb(cfg.midHex);
  if(cfg.highlightHex) e.highlight=hexRgb(cfg.highlightHex);
  if(cfg.accentHex) e.accent=hexRgb(cfg.accentHex);
  return e;
}

const EMOTIONS={
  blue:emotionPalette({
    label:'BLUE · CALM · FRIENDLY · SAFE',
    shadowHex:'#040a18',deepHex:'#0a2848',baseHex:'#22b8e8',midHex:'#5ce4ff',highlightHex:'#e8fcff',
    coreHex:'#f6feff',hotHex:'#88f0ff',accentHex:'#ffcf66',
    pulse:6.5,pulseMode:'wave',pulseAmp:0.095,chaos:0.035,chaosFreq:0.12,edgeFlicker:false,
    glowSize:0.034,glowOp:0.48,silver:0.09,silverStyle:'orbs',
    autoSpeed:0.0016,density:0.68,size:6,radius:1.85,
  }),
  yellow:emotionPalette({
    label:'YELLOW · CURIOUS · PROCESSING · TRANSITION',
    shadowHex:'#2A1800',deepHex:'#5A4200',baseHex:'#F0C820',midHex:'#FFE878',highlightHex:'#FFFDE8',
    accentHex:'#6fb0ff',
    pulse:6.5,pulseMode:'wave',pulseAmp:0.095,chaos:0.035,chaosFreq:0.12,edgeFlicker:false,
    glowSize:0.034,glowOp:0.48,silver:0.09,silverStyle:'orbs',
    autoSpeed:0.0016,density:0.68,size:4.75,radius:1.85,
  }),
  red:emotionPalette({
    label:'RED · DANGER · AGGRESSION · ALERT',
    shadowHex:'#280808',deepHex:'#7A2828',baseHex:'#F04048',hotHex:'#FF7060',coreHex:'#FF8878',
    accentHex:'#74e8ff',
    pulse:6.5,pulseMode:'wave',pulseAmp:0.095,chaos:0.035,chaosFreq:0.12,edgeFlicker:false,
    glowSize:0.034,glowOp:0.48,silver:0.09,silverStyle:'orbs',
    autoSpeed:0.0016,density:0.68,size:6,radius:1.85,
  }),
  purple:emotionPalette({
    label:'PURPLE · EMPATHY · BOND · CONNECTION',
    shadowHex:'#140a12',deepHex:'#321828',baseHex:'#8e5888',midHex:'#c890b0',highlightHex:'#f0d0e0',
    accentHex:'#58e1c0',
    pulse:6.5,pulseMode:'wave',pulseAmp:0.095,chaos:0.035,chaosFreq:0.12,edgeFlicker:false,
    glowSize:0.034,glowOp:0.48,silver:0.09,silverStyle:'orbs',
    autoSpeed:0.0016,density:0.68,size:4,radius:1.85,
  }),
};

const COLOR_KEYS=['shadow','deep','base','mid','highlight','hot','core'];
const MOTION_KEYS=['pulse','chaos','radius','size','density','autoSpeed','pulseAmp','glowSize','glowOp','silver','chaosFreq','pulseMode','edgeFlicker','silverStyle'];
const SLIDER_KEYS=['pulse','density','chaos','radius','size'];
const LOCKED_PARAMS={
  blue:{ size:6 },
  purple:{ size:4 },
  yellow:{ size:4.75 },
  red:{ size:6 },
};
const ANGER_PULSE_BASE=0.4;
const CYCLE_ORDER=['blue','purple','red','yellow'];
const CYCLE_SEC=28;
let cycleOn=false;
let cycleStartAt=0;

function innerJitter(t,phase,ox,oy,oz,amt){
  const a=Math.sin(t*1.6+phase*2.3+oy*3.4);
  const b=Math.sin(t*2.1+ox*4.2+phase*1.7);
  const c=Math.cos(t*1.9+oz*3.8+phase*0.9);
  const d=Math.sin(t*3.4+phase*3.1+ox*oz*5);
  const e=Math.cos(t*2.7+oy*5.1+phase*2.5);
  return {
    x:(a*b+d*0.5)*amt,
    y:(c*a+e*0.45)*amt,
    z:(b*c+d*0.55)*amt,
  };
}

function getAngerMod(t){
  const p=Math.PI*2;
  const ampMul=1+0.04*Math.sin(t*p/7+0.6)+0.028*Math.sin(t*p/5+1.4);
  return {period:ANGER_PULSE_BASE, amp:ampMul};
}
function lockedParamsFor(name){ return LOCKED_PARAMS[name]; }

function copyEmotion(e){
  const c={...e};
  for(const k of COLOR_KEYS){ if(e[k]) c[k]=[...e[k]]; }
  return c;
}
let params=copyEmotion(EMOTIONS.red);
let target=copyEmotion(EMOTIONS.red);
let activeEmotion='red';
const lerp=(a,b,t)=>a+(b-a)*t;

function emotionPreset(name){
  const e=copyEmotion(EMOTIONS[name]);
  const lp=LOCKED_PARAMS[name];
  if(lp) for(const [k,v] of Object.entries(lp)) e[k]=v;
  return e;
}

const smoothstep=t=>t*t*(3-2*t);
const smootherstep=t=>t*t*t*(t*(t*6-15)+10);
const HARD_CYCLE_SEGMENTS={'purple-red':true,'yellow-blue':true};
const logLerp=(a,b,t)=>Math.exp(Math.log(Math.max(a,1e-6))*(1-t)+Math.log(Math.max(b,1e-6))*t);

let cycleSegment={a:'blue',b:'purple',t:0};

function cycleSegmentKey(a,b){ return a+'-'+b; }

function cycleBlendSt(seg){
  let t=smootherstep(seg.t);
  if(HARD_CYCLE_SEGMENTS[cycleSegmentKey(seg.a,seg.b)]) t=smootherstep(t);
  return t;
}

function cycleColorBlendSt(seg){
  if(!HARD_CYCLE_SEGMENTS[cycleSegmentKey(seg.a,seg.b)]) return cycleBlendSt(seg);
  return smootherstep(smootherstep(smootherstep(seg.t)));
}

const FLAT_BREATH={breath:0.5,swell:0,scale:1,disperse:0,innerScale:1};

function getSphereBreathForEmotion(t,emotion){
  return FLAT_BREATH;
}

function cycleStyleWeights(){
  if(!cycleOn) return null;
  const st=cycleBlendSt(cycleSegment);
  const wa=1-st, wb=st;
  const a=cycleSegment.a, b=cycleSegment.b;
  const colorSt=cycleColorBlendSt(cycleSegment);
  const w={calm:0,purple:0,red:0,yellow:0,wa,wb,a,b,st,colorSt};
  const add=(name,wt)=>{
    const m=EMOTIONS[name].pulseMode, s=EMOTIONS[name].silverStyle;
    if(m==='calm') w.calm+=wt;
    if(m==='wave') w.purple+=wt;
    if(m==='heartbeat') w.red+=wt;
    if(m==='burst'||s==='sparks') w.yellow+=wt;
  };
  add(a,wa);
  add(b,wb);
  return w;
}

function emotionPick(cw,name){
  if(!cw) return activeEmotion===name?1:0;
  return (cw.a===name?cw.wa:0)+(cw.b===name?cw.wb:0);
}

function shellShimmerRgb(cw,params,target){
  const pick=(name)=>{
    const e=EMOTIONS[name];
    return e.hot||e.highlight||e.mid||e.base||e.accent||[0.5,0.5,0.5];
  };
  if(cw){
    const ea=pick(cw.a), eb=pick(cw.b);
    return [ea[0]*cw.wa+eb[0]*cw.wb, ea[1]*cw.wa+eb[1]*cw.wb, ea[2]*cw.wa+eb[2]*cw.wb];
  }
  const p=target||params;
  const c=p.hot||p.highlight||p.mid||p.base||p.accent;
  return c?[c[0],c[1],c[2]]:[0.5,0.5,0.5];
}

function cyclePaintWeights(){
  const cw=cycleStyleWeights();
  if(!cw) return null;
  const {a,b,wa,wb}=cw;
  const from=(test)=> (test(EMOTIONS[a])?wa:0)+(test(EMOTIONS[b])?wb:0);
  return {
    wYellow:from(e=>e.silverStyle==='sparks'),
    wShards:from(e=>e.silverStyle==='shards'),
    wOrbs:(a==='purple'?wa:0)+(b==='purple'?wb:0),
    wCalmBlue:(a==='blue'?wa:0)+(b==='blue'?wb:0),
  };
}

function silverShellAmt(style,silver){
  if(style==='shards') return silver*0.12;
  if(style==='sparks') return silver*0.08;
  if(style==='orbs') return silver*0.08;
  return silver*0.05;
}
function silverInnerAmt(style,silver){
  if(style==='sparks') return silver*0.45;
  if(style==='shards') return silver*0.35;
  if(style==='orbs') return silver*0.38;
  return silver*0.25;
}

function getCycleSegment(phase){
  const n=CYCLE_ORDER.length;
  let p=phase%1;
  if(p<0) p+=1;
  const x=p*n;
  const i=Math.min(Math.floor(x),n-1);
  const j=(i+1)%n;
  const t=x-i;
  return {a:CYCLE_ORDER[i],b:CYCLE_ORDER[j],t};
}

function buildCycleTarget(phase){
  const seg=getCycleSegment(phase);
  cycleSegment=seg;
  const st=cycleBlendSt(seg);
  const hard=!!HARD_CYCLE_SEGMENTS[cycleSegmentKey(seg.a,seg.b)];
  activeEmotion=st>=0.5?seg.b:seg.a;
  const presetA=emotionPreset(seg.a);
  const presetB=emotionPreset(seg.b);
  target=copyEmotion(presetA);
  const scalarKeys=['pulse','density','chaos','radius','size','autoSpeed','pulseAmp','glowSize','glowOp','silver','chaosFreq'];
  const logKeys=new Set(['chaos','glowOp','pulseAmp','chaosFreq']);
  for(const k of scalarKeys){
    if(hard&&logKeys.has(k)) target[k]=logLerp(presetA[k],presetB[k],st);
    else target[k]=(1-st)*presetA[k]+st*presetB[k];
  }
  target.pulseMode=st>=0.5?presetB.pulseMode:presetA.pulseMode;
  target.silverStyle=st>=0.5?presetB.silverStyle:presetA.silverStyle;
  target.edgeFlicker=!!(EMOTIONS[seg.a].edgeFlicker||EMOTIONS[seg.b].edgeFlicker);
  target.edgeFlickerAmt=(EMOTIONS[seg.a].edgeFlicker?(1-st):0)+(EMOTIONS[seg.b].edgeFlicker?st:0);
  for(const k of COLOR_KEYS){
    const colA=EMOTIONS[seg.a][k];
    const colB=EMOTIONS[seg.b][k];
    if(colA&&colB) target[k]=[(1-st)*colA[0]+st*colB[0],(1-st)*colA[1]+st*colB[1],(1-st)*colA[2]+st*colB[2]];
    else if(colA) target[k]=[...colA];
    else if(colB) target[k]=[...colB];
    else delete target[k];
  }
  for(const k of COLOR_KEYS){
    if(!EMOTIONS[seg.a][k]&&!EMOTIONS[seg.b][k]) delete target[k];
  }
  target.label=`${seg.a.toUpperCase()} ${((1-st)*100).toFixed(0)}% · ${seg.b.toUpperCase()} ${(st*100).toFixed(0)}%`;
}

function setDotActive(id){
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}

function switchEmotion(name){
  cycleOn=false;
  activeEmotion=name;
  target=emotionPreset(name);
  target.edgeFlickerAmt=target.edgeFlicker?1:0;
  params=copyEmotion(target);
  spawnEnabled=true;
  innerSpawnAcc=0;
  innerSpawnCursor=0;
  document.getElementById('label').textContent=target.label||'';
  setDotActive('d-'+name);
}

function toggleCycle(){
  cycleOn=true;
  cycleStartAt=performance.now();
  // keep spawner on so the "blend" view still shows independent particles
  spawnEnabled=true;
  setDotActive('d-cycle');
  buildCycleTarget(0);
  document.getElementById('label').textContent=target.label||'';
}

function tickCycle(){
  if(!cycleOn) return;
  const elapsed=(performance.now()-cycleStartAt)/1000;
  const phase=(elapsed%CYCLE_SEC)/CYCLE_SEC;
  buildCycleTarget(phase);
  document.getElementById('label').textContent=target.label||'';
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.01, 120);
camera.position.z = 5;
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setClearColor(0x000000);
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);
const cloudBg = createCloudBackground(scene, camera, group);

const SHELL_N = 520;
const INNER_N = 56;
const SHELL_PT_MUL = 0.018;
const INNER_PT_MUL = 0.054;
const GLOW_PT_MUL = 17.5;
const SWIRL_SPIN = 1.35;
const SWIRL_TANG_SHELL = 0.14;
const SWIRL_TANG_INNER = 0.1;
const SWIRL_IN_SHELL = 0.32;
const SWIRL_IN_INNER = 0.4;

// Slow, one-by-one continuous emitter (inner only; shell stays always-on)
const SPAWN_INNER_LIFE = 5.8;
const SPAWN_INNER_FADE = 1.2;
const SPAWN_INNER_INTERVAL = 0.65; // firefly pace: one-by-one, sparse
const SPAWN_INNER_AMP = 0.34;
let spawnEnabled=true;
let innerSpawnCursor=0;
let innerSpawnAcc=0;
let lastAnimT=0;

function swirlInward(t, phase, ox, oy, oz, len, tangAmt, inAmt){
  const inv=1/(len||1);
  const nx=ox*inv, ny=oy*inv, nz=oz*inv;
  let tx=ny*0.55-nz*0.35, ty=nz*0.5-nx*0.4, tz=nx*0.45-ny*0.5;
  let tl=Math.sqrt(tx*tx+ty*ty+tz*tz)||1;
  tx/=tl; ty/=tl; tz/=tl;
  let bx=ny*tz-nz*ty, by=nz*tx-nx*tz, bz=nx*ty-ny*tx;
  let bl=Math.sqrt(bx*bx+by*by+bz*bz)||1;
  bx/=bl; by/=bl; bz/=bl;
  const edge=Math.min(1,Math.max(0.42,len*0.95));
  const ang=t*SWIRL_SPIN+phase*2.4+(1.05-len)*t*0.55;
  const coil=Math.sin(ang*1.35-len*2.4)*0.5+0.5;
  const pull=inAmt*(0.55+0.45*coil);
  const spin=tangAmt*len*edge*(1.1+0.25*Math.sin(t*0.42+phase));
  const c=Math.cos(ang), s=Math.sin(ang);
  const rx=nx*c-nz*s*0.35, ry=ny*c+nx*s*0.2, rz=nz*c+nx*s*0.35;
  return {
    dx:(tx*c+bx*s)*spin+(rx-nx)*len*pull*0.35,
    dy:(ty*c+by*s)*spin+(ry-ny)*len*pull*0.35,
    dz:(tz*c+bz*s)*spin+(rz-nz)*len*pull*0.35,
    radScale:Math.max(0.42,1-pull),
  };
}

function makeGlowTexture(){
  const c=document.createElement('canvas');
  c.width=c.height=64;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,64,64);
  const tex=new THREE.CanvasTexture(c);
  tex.needsUpdate=true;
  return tex;
}
const glowTex=makeGlowTexture();

function makeFacetGlowTexture(){
  const c=document.createElement('canvas');
  c.width=c.height=64;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,64,64);
  ctx.save();
  ctx.translate(32,32);
  ctx.rotate(Math.PI/4);
  ctx.scale(1.15,0.58);
  const g=ctx.createRadialGradient(0,0,0,0,0,30);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.32,'rgba(255,255,255,0.52)');
  g.addColorStop(0.72,'rgba(255,255,255,0.12)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;
  ctx.fillRect(-30,-30,60,60);
  ctx.restore();
  const streak=ctx.createLinearGradient(6,32,58,32);
  streak.addColorStop(0,'rgba(255,255,255,0)');
  streak.addColorStop(0.45,'rgba(255,255,255,0.42)');
  streak.addColorStop(0.55,'rgba(255,255,255,0.42)');
  streak.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=streak;
  ctx.fillRect(6,28,52,8);
  const tex=new THREE.CanvasTexture(c);
  tex.needsUpdate=true;
  return tex;
}
const facetGlowTex=makeFacetGlowTexture();

function patchPerVertexSize(pointsMaterial, attrName){
  pointsMaterial.customProgramCacheKey=()=>`pvSize:${attrName}:${pointsMaterial.size}`;
  pointsMaterial.onBeforeCompile=(shader)=>{
    shader.vertexShader=shader.vertexShader
      .replace('#include <common>', `#include <common>\nattribute float ${attrName};`)
      .replace('#include <pointsize>', `#include <pointsize>\n gl_PointSize *= ${attrName};`);
  };
  pointsMaterial.needsUpdate=true;
}

// Shell (dense border)
const shellPos=new Float32Array(SHELL_N*3);
const shellOrig=new Float32Array(SHELL_N*3);
const shellPhase=new Float32Array(SHELL_N);
const shellColors=new Float32Array(SHELL_N*3);
const golden=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<SHELL_N;i++){

function lerpRgb(a,b,t,out){
  if(!a||!b){ out[0]=out[1]=out[2]=0.5; return; }
  out[0]=a[0]+(b[0]-a[0])*t;
  out[1]=a[1]+(b[1]-a[1])*t;
  out[2]=a[2]+(b[2]-a[2])*t;
}
function colorCopy(c){ return [c[0],c[1],c[2]]; }
function colorOr(p,tgt,key){
  const c=(tgt&&tgt[key])||(p&&p[key]);
  return c||[0.5,0.5,0.5];
}
function mixSilver(rgb,amount,out,colorBias=0){
  const b=Math.min(1,Math.max(0,colorBias));
  const amt=amount*(1-b*0.8);
  const m=1-amt;
  const sr=rgb[0]*(0.72+0.26*b)+SILVER[0]*(0.28-0.26*b);
  const sg=rgb[1]*(0.72+0.26*b)+SILVER[1]*(0.28-0.26*b);
  const sb=rgb[2]*(0.72+0.26*b)+SILVER[2]*(0.28-0.26*b);
  out[0]=rgb[0]*m+sr*amt;
  out[1]=rgb[1]*m+sg*amt;
  out[2]=rgb[2]*m+sb*amt;
}
function tintedLift(r,g,bl,amt,colorBias=0){
  const bias=Math.min(1,Math.max(0,colorBias));
  const floor=0.2*(1-bias)+0.03*bias;
  const slope=0.8*(1-bias)+0.97*bias;
  return [
    Math.min(1,r+amt*(floor+r*slope)),
    Math.min(1,g+amt*(floor+g*slope)),
    Math.min(1,bl+amt*(floor+bl*slope)),
  ];
}
function emotionColorBias(){
  const cw=cycleStyleWeights();
  if(!cw){
    if(activeEmotion==='red') return 0.9;
    if(activeEmotion==='yellow') return 0.5;
    if(activeEmotion==='blue'||activeEmotion==='purple') return 0.22;
    return 0.35;
  }
  const pick=(e)=>(cw.a===e?cw.wa:0)+(cw.b===e?cw.wb:0);
  return pick('red')*0.9+pick('yellow')*0.5+pick('blue')*0.22+pick('purple')*0.22;
}

function buildStops(p,tgt){
  if(tgt.core&&tgt.hot){
    return [
      {at:0,c:colorCopy(colorOr(p,tgt,'core'))},{at:0.22,c:colorCopy(colorOr(p,tgt,'hot'))},
      {at:0.48,c:colorCopy(colorOr(p,tgt,'base'))},{at:0.72,c:colorCopy(colorOr(p,tgt,'deep'))},
      {at:1,c:colorCopy(colorOr(p,tgt,'shadow'))},
    ];
  }
  return [
    {at:0,c:colorCopy(colorOr(p,tgt,'highlight'))},{at:0.28,c:colorCopy(colorOr(p,tgt,'mid'))},
    {at:0.52,c:colorCopy(colorOr(p,tgt,'base'))},{at:0.74,c:colorCopy(colorOr(p,tgt,'deep'))},
    {at:1,c:colorCopy(colorOr(p,tgt,'shadow'))},
  ];
}
function presetForStops(name){
  return emotionPreset(name);
}
function sampleStops(t,stops,out){
  const u=Math.max(0,Math.min(1,t));
  for(let i=0;i<stops.length-1;i++){
    if(u<=stops[i+1].at){
      lerpRgb(stops[i].c,stops[i+1].c,(u-stops[i].at)/(stops[i+1].at-stops[i].at),out);
      return;
    }
  }
  out[0]=stops[stops.length-1].c[0];
  out[1]=stops[stops.length-1].c[1];
  out[2]=stops[stops.length-1].c[2];
}

function getPulseWave(t,period,mode){
  const f=(1/Math.max(period,0.05))*Math.PI*2;
  const s=Math.sin(t*f);
  if(mode==='calm'){
    const eased=(1-Math.cos(t*f))*0.5;
    return 0.5+(eased-0.5)*0.22;
  }
  if(mode==='breath') return s*0.5+0.5;
  if(mode==='heartbeat'){
    if(activeEmotion==='red'){
      const eased=(1-Math.cos(t*f))*0.5;
      const slow=(1-Math.cos(t*f*0.48+0.5))*0.5;
      return eased*0.8+slow*0.2;
    }
    const bump=Math.max(0,s);
    return bump*bump*(0.65+0.35*Math.max(0,Math.sin(t*f*2+0.4)));
  }
  if(mode==='burst'){
    if(activeEmotion==='yellow'){
      const eased=(1-Math.cos(t*f))*0.5;
      return 0.38+0.62*eased;
    }
    return Math.pow(Math.max(0,s),2.4);
  }
  if(mode==='wave'){
    if(activeEmotion==='purple'){
      const w1=(1-Math.cos(t*f))*0.5;
      const w2=(1-Math.cos(t*f*0.52+0.85))*0.5;
      const w3=(1-Math.cos(t*f*0.34+2.05))*0.5;
      return w1*0.58+w2*0.28+w3*0.14;
    }
    const a=s*0.5+0.5,b=Math.sin(t*f*0.62+1.1)*0.5+0.5;
    return a*0.72+b*0.28;
  }
  return s*0.5+0.5;
}

}

function particleSparkle(t, phase, ox, oy, oz, idx, shell){
  const tw=0.5+0.5*Math.sin(t*14.5+phase*3.7+ox*5.2+oy*4.1);
  const tw2=0.5+0.5*Math.sin(t*22.3+phase*5.1+oz*6.8);
  const twinkle=Math.pow(tw*tw2,1.35)*(shell?0.3:0.38);
  const popGate=Math.sin(t*3.1+phase*11.3+idx*0.17);
  const pop=popGate>0.92?(popGate-0.92)/0.08*(shell?0.38:0.5):0;
  return twinkle+pop;
}

function updateColors(shimmerT=0){
  try{
    const t=shimmerT||0;
    const cw=cycleStyleWeights();
    const stops=buildStops(params,target);
    const stopsA=cw?buildStops(params,presetForStops(cw.a)):null;
    const stopsB=cw?buildStops(params,presetForStops(cw.b)):null;
    const blendSt=cw?cw.colorSt:0;
    const silver=params.silver||0.08;
    const pw=cyclePaintWeights();
    const style=target.silverStyle||params.silverStyle||'droplets';
    let shellSilver=silver*(style==='shards'?0.1:0.05);
    let innerSilver=silver*0.25;
    if(pw){
      shellSilver=0;
      innerSilver=0;
      const add=(name,wt)=>{
        const e=EMOTIONS[name], s=e.silver||silver;
        shellSilver+=wt*silverShellAmt(e.silverStyle,s);
        innerSilver+=wt*silverInnerAmt(e.silverStyle,s);
      };
      add(cw.a,cw.wa);
      add(cw.b,cw.wb);
    }else{
      if(style==='sparks'){ shellSilver=silver*0.08; innerSilver=silver*0.45; }
      if(style==='shards'){ shellSilver=silver*0.12; innerSilver=silver*0.35; }
      if(style==='orbs'){ shellSilver=silver*0.08; innerSilver=silver*0.38; }
    }

    const wYellow=pw?pw.wYellow:(activeEmotion==='yellow'&&style==='sparks'?1:0);
    const wCalmBlue=0;
    const wPurpleOrb=emotionPick(cw,'purple');
    const wBlueInner=0;
    const wShards=pw?pw.wShards:(style==='shards'?1:0);
    const wRedInner=0;
    const wRedShell=0;
    const wYellowShell=0;
    const seqBase=cycleOn?activeEmotion:activeEmotion;
    const shimmer=shellShimmerRgb(cw,params,target);
    let ar=shimmer[0], ag=shimmer[1], ab=shimmer[2];
    for(let i=0;i<SHELL_N;i++){
      const i3=i*3;
      const ox=shellOrig[i3],oy=shellOrig[i3+1],oz=shellOrig[i3+2];
      const d=Math.sqrt(ox*ox+oy*oy+oz*oz)/1.05;
      let sampleD=d, silverAmt=0, edgeFade=1;
      if(wCalmBlue>0.001){
        const edge=Math.max(0,Math.min(1,(d-0.84)/0.22));
        const calmD=d*(1-edge*0.45)+0.06;
        const calmSilver=shellSilver*(0.03+0.08*d)*(1-edge*0.75);
        const calmFade=1-edge*0.55;
        sampleD=d*(1-wCalmBlue)+calmD*wCalmBlue;
        silverAmt=shellSilver*(0.1+0.35*d)*(1-wCalmBlue)+calmSilver*wCalmBlue;
        edgeFade=1*(1-wCalmBlue)+calmFade*wCalmBlue;
      }
      if(wRedShell>0.001){
        const rg=redShellGlow(shimmerT,shellPhase[i],ox,oy,oz,i);
        const rw=smoothstep(Math.min(1,wRedShell));
        const sg=sparkleGate(i,shellPhase[i],ox,oy,oz,0.76);
        sampleD=d+rg.jitter*rw*sg;
      }
      if(wYellowShell>0.001){
        const yg=yellowShellGlow(shimmerT,shellPhase[i],ox,oy,oz);
        const ysw=smoothstep(Math.min(1,wYellowShell));
        sampleD=d*(1-ysw*0.5)+(d+yg.jitter)*ysw*0.5;
      }
      if(cw){
        sampleStops(sampleD,stopsA,_rgb);
        sampleStops(sampleD,stopsB,_rgb2);
        lerpRgb(_rgb,_rgb2,blendSt,_rgb);
      }else sampleStops(sampleD,stops,_rgb);
      if(wRedShell>0.001){
        sampleStops(sampleD,WARM_RED_STOPS,_rgb2);
        const rwMix=smoothstep(Math.min(1,wRedShell))*0.78;
        lerpRgb(_rgb,_rgb2,rwMix,_rgb);
      }
      _rgb2[0]=_rgb[0]; _rgb2[1]=_rgb[1]; _rgb2[2]=_rgb[2];
      let r=_rgb2[0],g=_rgb2[1],b=_rgb2[2];
      if(wRedShell>0.001){
        const rg=redShellGlow(shimmerT,shellPhase[i],ox,oy,oz,i);
        const rs=redShardSparkle(shimmerT,shellPhase[i],ox,oy,oz,i);
        const rw=smoothstep(Math.min(1,wRedShell))*0.78;
        const sg=sparkleGate(i,shellPhase[i],ox,oy,oz,0.74);
        tintWarmShell(r*rg.mul,g*rg.mul*0.94,b*rg.mul*0.9,(rg.glow*0.45+rg.spark*0.06*sg)*rw,_rgb);
        tintWarmSpark(_rgb[0],_rgb[1],_rgb[2],rs.flash*rw*sg*0.42,_rgb2);
        pushWarmSaturation(_rgb2[0],_rgb2[1],_rgb2[2],rw*0.32*sg,_rgb);
        const rr=_rgb[0],rgG=_rgb[1],rb=_rgb[2];
        const rwTint=rw*(0.35+sg*0.65);
        r=r*(1-rwTint)+rr*rwTint;
        g=g*(1-rwTint)+rgG*rwTint;
        b=b*(1-rwTint)+rb*rwTint;
      }
      if(wYellowShell>0.001){
        const yg=yellowShellGlow(shimmerT,shellPhase[i],ox,oy,oz);
        const ysw=smoothstep(Math.min(1,wYellowShell));
        tintYellowShell(r*yg.mul,g*yg.mul,b*yg.mul,yg.glow*ysw,_rgb);
        const yr=_rgb[0],ygG=_rgb[1],yb=_rgb[2];
        r=r*(1-ysw)+yr*ysw;
        g=g*(1-ysw)+ygG*ysw;
        b=b*(1-ysw)+yb*ysw;
      }
      if(wYellow>0.001){
        const yw=smoothstep(Math.min(1,wYellow))*0.48;
        const yf=yellowSparkFlicker(shimmerT,shellPhase[i],ox,oy,oz);
        tintBrightYellow(r*yf.mul,g*yf.mul,b*yf.mul,yf.flash*0.2,_rgb);
        const yr=_rgb[0],yg=_rgb[1],yb=_rgb[2];
        r=r*(1-yw)+yr*yw;
        g=g*(1-yw)+yg*yw;
        b=b*(1-yw)+yb*yw;
      }
      if(wCalmBlue>0.001){
        const cw=smoothstep(Math.min(1,wCalmBlue));
        const cg=cyanDropletGlow(shimmerT,shellPhase[i],ox,oy,oz);
        tintCyanGlow(r*cg.mul,g*cg.mul,b*cg.mul,cg.glow*cw,0,_rgb);
        const cr=_rgb[0],cgG=_rgb[1],cb=_rgb[2];
        r=r*(1-cw)+cr*cw;
        g=g*(1-cw)+cgG*cw;
        b=b*(1-cw)+cb*cw;
      }
      if(wPurpleOrb>0.001){
        const pw=smoothstep(Math.min(1,wPurpleOrb));
        const pg=purpleEmpathyGlow(shimmerT,shellPhase[i],ox,oy,oz);
        tintPurpleGlow(r*pg.mul,g*pg.mul,b*pg.mul,pg.glow*pw*0.5,_rgb);
        const sr=_rgb[0],sg=_rgb[1],sb=_rgb[2];
        r=r*(1-pw)+sr*pw;
        g=g*(1-pw)+sg*pw;
        b=b*(1-pw)+sb*pw;
      }
      const edgeAccent=Math.max(0,Math.min(1,(d-0.62)/0.38));
      const accTw=0.38+0.62*Math.sin(t*(8.4+shellPhase[i]*0.17)+shellPhase[i]*5.3+ox*2.7+oy*2.1+oz*1.4);
      let accAmt=edgeAccent*(0.14+accTw*accTw*0.62);
      if(wRedShell>0.2){
        const sg=sparkleGate(i,shellPhase[i],ox,oy,oz,0.8);
        accAmt*=sg*(1-wRedShell*0.55);
      }
      let bar=ar, bag=ag, bab=ab;
      if(wRedShell>0.001){
        const rwA=smoothstep(Math.min(1,wRedShell));
        bar=WARM_SHELL[0]*rwA+ar*(1-rwA);
        bag=WARM_SHELL[1]*rwA+ag*(1-rwA);
        bab=WARM_SHELL[2]*rwA+ab*(1-rwA);
      }
      r=r*(1-accAmt)+bar*accAmt;
      g=g*(1-accAmt)+bag*accAmt;
      b=b*(1-accAmt)+bab*accAmt;
      shellColors[i3]=Math.min(r*edgeFade,1);
      shellColors[i3+1]=Math.min(g*edgeFade,1);
      shellColors[i3+2]=Math.min(b*edgeFade,1);
    }
    shellGeo.attributes.color.needsUpdate=true;

    for(let i=0;i<INNER_N;i++){
      const i3=i*3;
      const d=Math.sqrt(innerOrig[i3]**2+innerOrig[i3+1]**2+innerOrig[i3+2]**2)/0.75;
      if(cw){
        sampleStops(d*0.42,stopsA,_rgb);
        sampleStops(d*0.42,stopsB,_rgb2);
        lerpRgb(_rgb,_rgb2,blendSt,_rgb);
      }else sampleStops(d*0.42,stops,_rgb);
      _rgb2[0]=_rgb[0]; _rgb2[1]=_rgb[1]; _rgb2[2]=_rgb[2];
      const ox=innerOrig[i3],oy=innerOrig[i3+1],oz=innerOrig[i3+2];
      let boost=1.42+(wShards>0.001?0.08*wShards:0);
      if(wRedInner>0.001) boost=1.28+(boost-1.28)*(1-smoothstep(Math.min(1,wRedInner))*0.55);
      let r=_rgb2[0],g=_rgb2[1],b=_rgb2[2];
      const tintStep=innerSeqTint[i];
      if(tintStep>0){
        sampleEmotionInnerRgb(cycleEmotionOffset(seqBase,tintStep),d,_rgb);
        const ta=tintStep===1?0.32:0.2;
        r=r*(1-ta)+_rgb[0]*ta;
        g=g*(1-ta)+_rgb[1]*ta;
        b=b*(1-ta)+_rgb[2]*ta;
      }
      if(wYellow>0.001){
        const yw=smoothstep(Math.min(1,wYellow))*0.48;
        const yf=yellowSparkFlicker(shimmerT,innerPhase[i],ox,oy,oz);
        tintBrightYellow(r*yf.mul*1.08,g*yf.mul*1.08,b*yf.mul*1.06,yf.flash*0.2,_rgb);
        const yr=_rgb[0],yg=_rgb[1],yb=_rgb[2];
        r=r*(1-yw)+yr*yw;
        g=g*(1-yw)+yg*yw;
        b=b*(1-yw)+yb*yw;
        boost=1+(1-yw)*(boost-1);
      }
      if(wRedInner>0.001){
        const rg=redShellGlow(shimmerT,innerPhase[i],ox,oy,oz,i);
        const rs=redShardSparkle(shimmerT,innerPhase[i],ox,oy,oz,i);
        const shardWt=Math.max(wShards,wRedInner*0.9);
        const rw=smoothstep(Math.min(1,wRedInner))*smoothstep(shardWt);
        const sg=sparkleGate(i,innerPhase[i],ox,oy,oz,0.77);
        tintRedShell(r*rg.mul,g*rg.mul*0.9,b*rg.mul*0.86,(rg.glow*0.38+rg.spark*0.05*sg+rs.flash*0.04*sg)*rw,_rgb);
        tintRedSpark(_rgb[0],_rgb[1],_rgb[2],rs.flash*rw*sg*0.48,_rgb2);
        pushRedSaturation(_rgb2[0],_rgb2[1],_rgb2[2],rw*0.45*sg,_rgb);
        const rr=_rgb[0],rgG=_rgb[1],rb=_rgb[2];
        const rwTint=rw*(0.42+sg*0.58);
        r=r*(1-rwTint)+rr*rwTint;
        g=g*(1-rwTint)+rgG*rwTint;
        b=b*(1-rwTint)+rb*rwTint;
      }
      if(wBlueInner>0.001){
        const cw=smoothstep(Math.min(1,wBlueInner));
        const cg=cyanDropletGlow(shimmerT,innerPhase[i],ox,oy,oz);
        tintCyanGlow(r*cg.mul*1.08,g*cg.mul*1.08,b*cg.mul*1.12,cg.glow*cw,0,_rgb);
        const cr=_rgb[0],cgG=_rgb[1],cb=_rgb[2];
        r=r*(1-cw)+cr*cw;
        g=g*(1-cw)+cgG*cw;
        b=b*(1-cw)+cb*cw;
        const bb=1.35+0.008*Math.sin(shimmerT*0.5+ox*3);
        boost=boost*(1-cw)+bb*cw;
      }
      if(wPurpleOrb>0.001){
        const pw=smoothstep(Math.min(1,wPurpleOrb));
        const pg=purpleEmpathyGlow(shimmerT,innerPhase[i],ox,oy,oz);
        tintPurpleGlow(r*pg.mul*1.05,g*pg.mul*1.05,b*pg.mul*1.04,pg.glow*pw*0.45,_rgb);
        const pr=_rgb[0],pu=_rgb[1],pb2=_rgb[2];
        r=r*(1-pw)+pr*pw;
        g=g*(1-pw)+pu*pw;
        b=b*(1-pw)+pb2*pw;
        boost=1+(1-pw)*(boost-1);
      }
      const ir=r*boost, ig=g*boost, ib=b*boost;
      innerColors[i3]=Math.min(ir,1);
      innerColors[i3+1]=Math.min(ig,1);
      innerColors[i3+2]=Math.min(ib,1);
    }
    innerGeo.attributes.color.needsUpdate=true;
  }catch(err){ console.error('updateColors',err); }
}
updateColors();

let isDragging=false, prevX=0, prevY=0, rotX=0, rotY=0, velX=0, velY=0;

renderer.domElement.addEventListener('mousedown', e=>{
  isDragging=true; prevX=e.clientX; prevY=e.clientY; velX=0; velY=0;
  document.body.classList.add('dragging');
});
window.addEventListener('mouseup', ()=>{ isDragging=false; document.body.classList.remove('dragging'); });
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  const dx=e.clientX-prevX, dy=e.clientY-prevY;
  velX=dy*0.006; velY=dx*0.006; rotX+=velX; rotY+=velY;
  prevX=e.clientX; prevY=e.clientY;
});
renderer.domElement.addEventListener('touchstart', e=>{
  isDragging=true; prevX=e.touches[0].clientX; prevY=e.touches[0].clientY; velX=0; velY=0;
},{passive:true});
window.addEventListener('touchend', ()=>{ isDragging=false; });
renderer.domElement.addEventListener('touchmove', e=>{
  if(!isDragging) return;
  const dx=e.touches[0].clientX-prevX, dy=e.touches[0].clientY-prevY;
  velX=dy*0.006; velY=dx*0.006; rotX+=velX; rotY+=velY;
  prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
},{passive:true});

switchEmotion('red');

const clock = new THREE.Clock();
const shellPosAttr=shellGeo.getAttribute('position');
const innerPosAttr=innerGeo.getAttribute('position');

function animate(){
  requestAnimationFrame(animate);
  tickCycle();
  const t=clock.getElapsedTime();
  const dt=Math.min(Math.max(t-lastAnimT,0),0.05);
  lastAnimT=t;
  const tNow=t;

  if(spawnEnabled){
    innerSpawnAcc+=dt;
    while(innerSpawnAcc>=SPAWN_INNER_INTERVAL){
      innerSpawnAcc-=SPAWN_INNER_INTERVAL;
      const idx=innerSpawnCursor++%INNER_N;
      innerBirth[idx]=tNow;
      innerSize[idx]=1.0+Math.random()*0.75;
      const p3=idx*3;
      innerPrev[p3]=innerPrev[p3+1]=innerPrev[p3+2]=0;
    }
  }

  const cw=cycleStyleWeights();
  const motionT=cycleOn?0.2:0.02;
  for(const k of SLIDER_KEYS) params[k]=lerp(params[k],target[k],motionT);
  for(const k of MOTION_KEYS){
    if(SLIDER_KEYS.includes(k)) continue;
    params[k]=lerp(params[k],target[k],motionT);
  }
  if(!cycleOn){
    params.edgeFlicker=!!target.edgeFlicker;
    if(target.pulseMode) params.pulseMode=target.pulseMode;
    if(target.silverStyle) params.silverStyle=target.silverStyle;
  }else{
    params.edgeFlicker=!!target.edgeFlicker;
    params.pulseMode=target.pulseMode;
    params.silverStyle=target.silverStyle;
    const hardColor=HARD_CYCLE_SEGMENTS[cycleSegmentKey(cycleSegment.a,cycleSegment.b)];
    const colorT=hardColor?0.045:0.1;
    for(const k of COLOR_KEYS){
      if(target[k]){
        if(!params[k]) params[k]=[...target[k]];
        else for(let i=0;i<3;i++) params[k][i]=lerp(params[k][i],target[k][i],colorT);
      }else delete params[k];
    }
  }

  const mode=target.pulseMode||'breath';
  const style=target.silverStyle||'droplets';
  const pw=cyclePaintWeights();
  const wShards=pw?pw.wShards:(style==='shards'?1:0);
  const wCalm=cw?cw.calm:(mode==='calm'?1:0);
  const wPurple=cw?cw.purple:(mode==='wave'?1:0);
  const wRed=cw?cw.red:(mode==='heartbeat'?1:0);
  const wYellow=0;
  const wChaosMotion=wRed+wYellow;
  // Avoid stacking fast chaos on top of red/yellow shell motion (causes runaway jitter).
  const wChaosShell=wChaosMotion*Math.max(0,1-wRed*0.95-wYellow*0.95);
  const wChaosInner=wChaosMotion*Math.max(0,1-wRed*0.9-wYellow*0.9);
  const wGlowChaos=Math.max(0,1-Math.min(1,wCalm+wPurple+wRed+wYellow));
  const wGlowSum=wCalm+wPurple+wRed+wYellow+wGlowChaos;
  const wMotionSum=wCalm+wPurple+wChaosMotion;
  const mNorm=wMotionSum>0.001?1/wMotionSum:1;
  const wEdge=cycleOn?(target.edgeFlickerAmt!=null?target.edgeFlickerAmt:(target.edgeFlicker?1:0)):(target.edgeFlicker?1:0);
  const angerMod=wRed>0.1?getAngerMod(t):null;
  let sphere,breath;
  if(cw){
    const sa=getSphereBreathForEmotion(t,cw.a);
    const sb=getSphereBreathForEmotion(t,cw.b);
    sphere={
      breath:cw.wa*sa.breath+cw.wb*sb.breath,
      swell:cw.wa*sa.swell+cw.wb*sb.swell,
      scale:cw.wa*sa.scale+cw.wb*sb.scale,
      disperse:cw.wa*sa.disperse+cw.wb*sb.disperse,
      innerScale:cw.wa*sa.innerScale+cw.wb*sb.innerScale,
    };
    breath=sphere.breath;
  }else{
    const calmPeriod=Math.max(target.pulse||2.75,2.75);
    const purplePeriod=Math.max(target.pulse||6.5,5.5);
    const breathPeriod=wCalm>0.5?calmPeriod:wPurple>0.5?purplePeriod:wRed>0.5?ANGER_PULSE_BASE:Math.max(target.pulse||0.4,0.05);
    const angerAmp=wRed>0.5?(target.pulseAmp||0.075)*(angerMod?angerMod.amp:1):target.pulseAmp||0.06;
    sphere=getSphereBreath(t,breathPeriod,mode,angerAmp);
    breath=sphere.breath;
  }
  const breathPeriodFor=(emotion)=>{
    const e=emotionPreset(emotion);
    const m=e.pulseMode;
    return m==='calm'?Math.max(e.pulse,2.75):m==='wave'?Math.max(e.pulse,5.5):emotion==='red'?ANGER_PULSE_BASE:Math.max(e.pulse,0.4);
  };
  const breathPeriod=cw
    ?cw.wa*breathPeriodFor(cw.a)+cw.wb*breathPeriodFor(cw.b)
    :(wCalm>0.5?Math.max(target.pulse||2.75,2.75):wPurple>0.5?Math.max(target.pulse||6.5,5.5):wRed>0.5?ANGER_PULSE_BASE:Math.max(target.pulse||0.4,0.05));
  const pulseFreq=(1/Math.max(breathPeriod,0.05))*Math.PI*2;
  const cf=params.chaosFreq||0.5;
  const radius=Number.isFinite(params.radius)?Math.max(params.radius,0.1):1.5;
  const density=Math.max(params.density||0.5,0.05);
  const pSize=Number.isFinite(params.size)?Math.max(params.size,0.1):2;

  const yellowPulse=wYellow>0.35;
  const purpleGlow=wPurple>0.35;
  shellMat.size=pSize*SHELL_PT_MUL*((yellowPulse||purpleGlow)
    ?0.97+0.03*Math.sin(t*pulseFreq*0.35)
    :wChaosShell>0.35?0.97+Math.sin(t*6)*0.025:1);
  let shellOp=wCalm*density*(0.52+sphere.breath*0.08)+wPurple*density*(0.6+(breath-0.5)*0.18)+wChaosMotion*density*(0.66+breath*0.16);
  if(wEdge>0.001){
    const flick=wYellow>0.2?0.97+0.02*Math.sin(t*pulseFreq*0.35):0.94+0.06*Math.sin(t*4.2);
    shellOp*=1-wEdge+flick*wEdge;
  }
  if(yellowPulse||purpleGlow) shellOp*=0.97+0.028*Math.sin(t*pulseFreq*0.32);
  shellMat.opacity=Math.min(Math.max(shellOp,0.28),1);

  const gNorm=wGlowSum>0.001?1/wGlowSum:1;
  const gbCalm=0.96+(breath-0.5)*0.04;
  const gbBurst=0.8+breath*0.2;
  const gbRed=0.92+(breath-0.5)*0.1;
  const glowBreath=(
    wCalm*gbCalm+wPurple*gbBurst+wRed*gbRed+wYellow*gbBurst+wGlowChaos*gbBurst
  )*gNorm;
  innerMat.size=pSize*INNER_PT_MUL*glowBreath;
  innerMat.opacity=Math.min(density*(wRed*(0.9+(breath-0.5)*0.08)+(1-wRed)*(0.88+breath*0.12)),1);
  const gmCalm=1.08, gmBurst=1, gmRed=0.9+(breath-0.5)*0.1, gmChaos=0.85;
  const glowSizeMul=(wCalm*gmCalm+wPurple*gmBurst+wRed*gmRed+wYellow*gmBurst+wGlowChaos*gmChaos)*gNorm;
  innerGlowMat.size=(params.glowSize||0.03)*GLOW_PT_MUL*glowBreath*glowSizeMul;
  const opCalm=0.88+(breath-0.5)*0.06, opPulse=0.75+breath*0.25;
  innerGlowMat.opacity=Math.min(density*(params.glowOp||0.35)*(
    wCalm*opCalm+(wPurple+wRed+wYellow+wGlowChaos)*opPulse
  )*gNorm,0.9);
  innerHalo2Mat.size=innerGlowMat.size*1.55;
  innerHalo3Mat.size=innerGlowMat.size*2.25;
  innerHalo2Mat.opacity=Math.min(innerGlowMat.opacity*0.58,0.85);
  innerHalo3Mat.opacity=Math.min(innerGlowMat.opacity*0.28,0.6);

  const chaosMul=wCalm*target.chaos*0.018+wPurple*target.chaos*0.01+wChaosInner*target.chaos*0.032;
  const shimmer=wCalm*0.028+wPurple*0.02+wYellow*0.012;
  const shellArr=shellPosAttr.array;
  const innerArr=innerPosAttr.array;
  for(let i=0;i<SHELL_N;i++){
    const i3=i*3;
    const ox=shellOrig[i3],oy=shellOrig[i3+1],oz=shellOrig[i3+2];
    const len=Math.sqrt(ox*ox+oy*oy+oz*oz)||1;
    const rippleWave=Math.sin(t*pulseFreq+shellPhase[i])*0.5+0.5;
    const ripple=wRed*breath+(1-wRed)*rippleWave;
    const rippleAmt=wCalm*0.018+wPurple*0.022+wYellow*0.014+wRed*0.016+wChaosShell*0.012;
    let dx=0,dy=0,dz=0,expand=1+sphere.disperse;
    if(wCalm>0.001){
      const ph=shellPhase[i];
      const edge=Math.max(0,Math.min(1,(len-0.88)/0.24));
      const shim=shimmer*(1+edge*2.4);
      const cdx=Math.sin(t*0.38+oy*1.6+ph)*shim+Math.sin(t*0.28+oz*2+ph*0.7)*shim*0.6;
      const cdy=Math.sin(t*0.33+oz*1.8+ph*1.1)*shim+Math.cos(t*0.44+ox*1.4+ph)*shim*0.5;
      const cdz=Math.sin(t*0.41+ox*2+ph*0.9)*shim;
      dx+=wCalm*mNorm*(cdx+edge*Math.sin(t*0.47+ph*2.3+oy*1.2)*0.038);
      dy+=wCalm*mNorm*(cdy+edge*Math.cos(t*0.39+ph*1.7+oz*1.4)*0.038);
      dz+=wCalm*mNorm*(cdz+edge*Math.sin(t*0.52+ph*2.9+ox*1.1)*0.034);
      expand+=wCalm*mNorm*edge*(Math.sin(t*0.44+ph*1.8)*0.09+Math.sin(t*0.33+ph*3.1+oy)*0.06);
    }
    if(wPurple>0.001){
      const ph=shellPhase[i];
      const wave=Math.sin(t*pulseFreq*0.28+ph+oy*0.6+oz*0.4)*0.5+0.5;
      const shim=shimmer*(0.75+wave*0.5);
      dx+=wPurple*mNorm*(Math.sin(t*0.2+oy*1.1+ph)*shim+Math.sin(t*0.16+oz*1.3+ph*0.65)*shim*0.55);
      dy+=wPurple*mNorm*(Math.sin(t*0.18+oz*1.5+ph*0.9)*shim+Math.cos(t*0.22+ox*1.2+ph)*shim*0.5);
      dz+=wPurple*mNorm*(Math.sin(t*0.21+ox*1.4+ph*0.75)*shim);
      expand+=wPurple*mNorm*(sphere.swell*0.045+wave*0.04*Math.sin(t*pulseFreq*0.22+ph*1.4));
    }
    if(wRed>0.001){
      const ph=shellPhase[i];
      const edge=Math.max(0,Math.min(1,(len-0.86)/0.22));
      const wave=Math.sin(t*pulseFreq*0.3+ph+ox*0.55)*0.5+0.5;
      const shim=shimmer*(0.65+wave*0.4)*(1+edge*1.6);
      dx+=wRed*mNorm*(Math.sin(t*0.23+oy*1.25+ph)*shim+Math.sin(t*0.19+oz*1.35+ph*0.7)*shim*0.5);
      dy+=wRed*mNorm*(Math.sin(t*0.21+oz*1.45+ph*0.95)*shim+Math.cos(t*0.25+ox*1.15+ph)*shim*0.48);
      dz+=wRed*mNorm*(Math.sin(t*0.24+ox*1.35+ph*0.8)*shim+edge*Math.sin(t*0.48+ph*2.1+oy)*0.018);
      expand+=wRed*mNorm*edge*(Math.sin(t*0.41+ph*1.6)*0.04+wave*0.03);
    }
    if(wYellow>0.001){
      const ph=shellPhase[i];
      const edge=Math.max(0,Math.min(1,(len-0.84)/0.24));
      const wave=Math.sin(t*pulseFreq*0.26+ph+oy*0.5)*0.5+0.5;
      const shim=shimmer*(0.7+wave*0.45)*(1+edge*1.4);
      dx+=wYellow*mNorm*(Math.sin(t*0.36+oy*1.4+ph)*shim+Math.sin(t*0.31+oz*1.6+ph*0.75)*shim*0.55);
      dy+=wYellow*mNorm*(Math.sin(t*0.34+oz*1.5+ph*1.05)*shim+Math.cos(t*0.4+ox*1.3+ph)*shim*0.5);
      dz+=wYellow*mNorm*(Math.sin(t*0.37+ox*1.5+ph*0.85)*shim+edge*Math.cos(t*0.44+ph*1.9+oz)*0.018);
      expand+=wYellow*mNorm*edge*(Math.sin(t*0.42+ph*1.7)*0.04+wave*0.03);
    }
    if(wChaosShell>0.001){
      const c=chaosMul;
      const cfS=cf*0.55;
      dx+=wChaosShell*mNorm*Math.sin(t*cfS*0.9+oy*2.2+shellPhase[i])*c;
      dy+=wChaosShell*mNorm*Math.sin(t*cfS*0.7+oz*1.8+shellPhase[i]*1.1)*c;
      dz+=wChaosShell*mNorm*Math.sin(t*cfS*1.1+ox*2.5+shellPhase[i]*0.7)*c;
    }
    const sw=swirlInward(t,shellPhase[i],ox,oy,oz,len,SWIRL_TANG_SHELL,SWIRL_IN_SHELL*(0.7+sphere.breath*0.35));
    dx+=sw.dx; dy+=sw.dy; dz+=sw.dz;
    const r=radius*sphere.scale*(1+(ripple-0.5)*rippleAmt);
    const nx=ox/len,ny=oy/len,nz=oz/len;
    const pr=len*r*expand*sw.radScale;
    const tx=nx*pr+dx, ty=ny*pr+dy, tz=nz*pr+dz;
    // Shell always-on: stable spherical outline while inner particles spawn/fade.
    shellArr[i3]=tx;
    shellArr[i3+1]=ty;
    shellArr[i3+2]=tz;
  }
  shellPosAttr.needsUpdate=true;

  for(let i=0;i<INNER_N;i++){
    const i3=i*3;
    const ox=innerOrig[i3],oy=innerOrig[i3+1],oz=innerOrig[i3+2];
    const len=Math.sqrt(ox*ox+oy*oy+oz*oz)||1;
    const rippleWave=Math.sin(t*pulseFreq+innerPhase[i])*0.5+0.5;
    const ripple=wRed*breath+(1-wRed)*rippleWave;
    const rippleAmt=wCalm*0.01+wPurple*0.016+wYellow*0.01+wRed*0.01+wChaosInner*0.01;
    let dx=0,dy=0,dz=0;
    if(wCalm>0.001){
      const ph=innerPhase[i];
      dx+=wCalm*mNorm*Math.sin(t*0.35+oy*1.5+ph)*shimmer*0.8;
      dy+=wCalm*mNorm*Math.sin(t*0.3+oz*1.7+ph*1.2)*shimmer*0.8;
      dz+=wCalm*mNorm*Math.cos(t*0.39+ox*1.6+ph*0.8)*shimmer*0.7;
    }
    if(wPurple>0.001){
      const ph=innerPhase[i];
      const wave=Math.sin(t*pulseFreq*0.25+ph+oy*0.5)*0.5+0.5;
      const shim=shimmer*(0.7+wave*0.45);
      dx+=wPurple*mNorm*Math.sin(t*0.19+oy*1.2+ph)*shim;
      dy+=wPurple*mNorm*Math.sin(t*0.17+oz*1.4+ph*1.1)*shim;
      dz+=wPurple*mNorm*Math.cos(t*0.2+ox*1.3+ph*0.85)*shim;
    }
    if(wChaosInner>0.001){
      const c=chaosMul;
      const cfI=cf*0.5;
      dx+=wChaosInner*mNorm*Math.sin(t*cfI*0.9+oy*2.5+innerPhase[i])*c;
      dy+=wChaosInner*mNorm*Math.sin(t*cfI*0.7+oz*2+innerPhase[i]*1.1)*c;
      dz+=wChaosInner*mNorm*Math.sin(t*cfI*1.1+ox*2.8+innerPhase[i]*0.7)*c;
    }
    const jitAmt=target.chaos*(wCalm*0.028+wPurple*0.038+wRed*0.012+wYellow*0.011+wChaosInner*(wShards*0.028+(1-wShards)*0.022))+0.01;
    const j=innerJitter(t,innerPhase[i],ox,oy,oz,jitAmt);
    dx+=j.x; dy+=j.y; dz+=j.z;
    const sw=swirlInward(t,innerPhase[i],ox,oy,oz,len,SWIRL_TANG_INNER,SWIRL_IN_INNER*(0.75+breath*0.3));
    dx+=sw.dx; dy+=sw.dy; dz+=sw.dz;
    const innerExpand=1+sphere.disperse*(wPurple*0.92+wChaosInner*0.12);
    const r=radius*sphere.innerScale*(1+(ripple-0.5)*rippleAmt)*sw.radScale;
    const innerC=target.chaos*(wPurple*0.016+wYellow*0.022+wRed*0.012+wChaosInner*(wShards*0.028+0.022*(1-wShards)));
    const streakMul=wRed*0.85+wPurple*0.32+wYellow*0.55+wChaosInner*0.45;
    const streakWave=Math.sin(t*streakMul+innerPhase[i])*innerC;
    const streak=wRed*sphere.swell*innerC+(1-wRed)*streakWave;
    const drift=0.82;
    const tx=ox*r*innerExpand+dx*drift+j.x*0.35+(ox/len)*streak;
    const ty=oy*r*innerExpand+dy*drift+j.y*0.35+(oy/len)*streak;
    const tz=oz*r*innerExpand+dz*drift+j.z*0.35+(oz/len)*streak;
    let vis=1;
    const born=innerBirth[i];
    if(spawnEnabled){
      if(born<0){
        vis=0;
        innerArr[i3]=innerArr[i3+1]=innerArr[i3+2]=0;
        innerPrev[i3]=innerPrev[i3+1]=innerPrev[i3+2]=0;
      }else{
        const age=tNow-born;
        if(age>=SPAWN_INNER_LIFE){
          innerBirth[i]=-1;
          vis=0;
          innerArr[i3]=innerArr[i3+1]=innerArr[i3+2]=0;
          innerPrev[i3]=innerPrev[i3+1]=innerPrev[i3+2]=0;
        }else{
          const p=Math.max(0,Math.min(1,age/(SPAWN_INNER_LIFE-SPAWN_INNER_FADE)));
          const pe=smootherstep(p);
          const blend=smoothstep(pe);
          const aI=1-pe;
          if(age>SPAWN_INNER_LIFE-SPAWN_INNER_FADE){
            const f=Math.max(0,(SPAWN_INNER_LIFE-age)/SPAWN_INNER_FADE);
            vis=smootherstep(f);
          }
          const nx=ox/len, ny=oy/len, nz=oz/len;
          const pr=len*r*innerExpand*sw.radScale;
          const ax=innerAxis[i3], ay=innerAxis[i3+1], az=innerAxis[i3+2];
          let ux=ay*nz-az*ny, uy=az*nx-ax*nz, uz=ax*ny-ay*nx;
          const ul=Math.sqrt(ux*ux+uy*uy+uz*uz)||1;
          ux/=ul; uy/=ul; uz/=ul;
          const vx=ny*uz-nz*uy, vy=nz*ux-nx*uz, vz=nx*uy-ny*ux;
          const ang=(tNow*1.25+innerPhase[i]*8.6);
          const cs=Math.cos(ang), sn=Math.sin(ang);
          const amp=pr*SPAWN_INNER_AMP*Math.pow(aI,1.75);
          const sx=nx*pr*pe+(ux*cs+vx*sn)*amp;
          const sy=ny*pr*pe+(uy*cs+vy*sn)*amp;
          const sz=nz*pr*pe+(uz*cs+vz*sn)*amp;
          innerArr[i3]=sx*(1-blend)+tx*blend;
          innerArr[i3+1]=sy*(1-blend)+ty*blend;
          innerArr[i3+2]=sz*(1-blend)+tz*blend;
        }
      }
      innerVis[i]=vis;
    }else{
      innerVis[i]=1;
      innerArr[i3]=tx; innerArr[i3+1]=ty; innerArr[i3+2]=tz;
    }
  }
  innerPosAttr.needsUpdate=true;
  updateColors(t);
  innerGeo.attributes.aSize.needsUpdate=true;

  // Apply fade AFTER updateColors() (updateColors overwrites the color buffers)
  // Shell stays fully visible; only apply per-particle fade to inner layer
  for(let i=0;i<INNER_N;i++){
    const v=innerVis[i];
    if(v>=0.999) continue;
    const i3=i*3;
    innerColors[i3]*=v; innerColors[i3+1]*=v; innerColors[i3+2]*=v;
  }
  innerGeo.attributes.color.needsUpdate=true;

  // Emit + update trail particles (after inner colors include fades)
  for(let i=0;i<INNER_N;i++){
    const vis=innerVis[i];
    if(vis<0.05) continue;
    const i3=i*3;
    const px=innerArr[i3], py=innerArr[i3+1], pz=innerArr[i3+2];
    const ox=innerPrev[i3], oy=innerPrev[i3+1], oz=innerPrev[i3+2];
    const dx=px-ox, dy=py-oy, dz=pz-oz;
    const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dist<TRAIL_EMIT_STEP) continue;
    const idx=trailHead++%TRAIL_POOL;
    const t3=idx*3;
    const jit=0.042;
    trailPos[t3]=px+(Math.random()-0.5)*jit;
    trailPos[t3+1]=py+(Math.random()-0.5)*jit;
    trailPos[t3+2]=pz+(Math.random()-0.5)*jit;
    trailVel[t3]=dx*0.4+(Math.random()-0.5)*0.028;
    trailVel[t3+1]=dy*0.4+(Math.random()-0.5)*0.028+0.012;
    trailVel[t3+2]=dz*0.4+(Math.random()-0.5)*0.028;
    const cr=innerColors[i3]*vis, cg=innerColors[i3+1]*vis, cb=innerColors[i3+2]*vis;
    trailBaseCol[t3]=cr;
    trailBaseCol[t3+1]=cg;
    trailBaseCol[t3+2]=cb;
    trailCol[t3]=cr;
    trailCol[t3+1]=cg;
    trailCol[t3+2]=cb;
    trailAge[idx]=TRAIL_LIFE;
    if(!trailAlive[idx]){
      trailAlive[idx]=1;
      trailActive[trailActiveN++]=idx;
    }
    innerPrev[i3]=px;
    innerPrev[i3+1]=py;
    innerPrev[i3+2]=pz;
  }
  for(let a=trailActiveN-1;a>=0;a--){
    const idx=trailActive[a];
    let age=trailAge[idx]-dt;
    const t3=idx*3;
    if(age<=0){
      trailAge[idx]=0;
      trailAlive[idx]=0;
      trailPos[t3]=trailPos[t3+1]=trailPos[t3+2]=0;
      trailCol[t3]=trailCol[t3+1]=trailCol[t3+2]=0;
      trailActive[a]=trailActive[--trailActiveN];
      continue;
    }
    trailAge[idx]=age;
    trailPos[t3]+=trailVel[t3]*dt;
    trailPos[t3+1]+=trailVel[t3+1]*dt;
    trailPos[t3+2]+=trailVel[t3+2]*dt;
    trailVel[t3]*=0.985;
    trailVel[t3+1]*=0.985;
    trailVel[t3+2]*=0.985;
    const fade=Math.pow(age/TRAIL_LIFE,1.5);
    trailCol[t3]=trailBaseCol[t3]*fade;
    trailCol[t3+1]=trailBaseCol[t3+1]*fade;
    trailCol[t3+2]=trailBaseCol[t3+2]*fade;
  }
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;

  if(!isDragging){
    velX*=0.92; velY*=0.92;
    rotX+=velX; rotY+=velY+params.autoSpeed;
  }
  group.rotation.x=rotX;
  group.rotation.y=rotY;

  const cwCloud=cycleOn?cycleStyleWeights():null;
  const worldR=radius*sphere.scale;
  const cloudRedMix=emotionPick(cwCloud,'red');
  const cloudPurpleMix=emotionPick(cwCloud,'purple');
  const cloudBlueMix=emotionPick(cwCloud,'blue');
  const cloudYellowMix=emotionPick(cwCloud,'yellow');
  cloudBg.update(group, sphere.scale, worldR, t, cloudRedMix, cloudPurpleMix, cloudBlueMix, cloudYellowMix);

  if(sphereCore){
    if(cycleOn) sphereCore.setCycleBlend(cycleSegment);
    else sphereCore.setCycleBlend(null);
    sphereCore.update(t,{
      params:{...params,emotion:activeEmotion},
      scale:radius*sphere.innerScale*1.35,
    });
  }

  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  cloudBg.onResize(innerWidth, innerHeight);
});
</script>
</body>
</html>
