<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fireflies Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 16px; left: 16px;
    color: #aaa; font: 13px/1.8 monospace;
    display: flex; flex-direction: column; gap: 6px;
  }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=color] { width: 28px; height: 22px; border: none; background: none; cursor: pointer; padding: 0; }
  input[type=range] { width: 120px; accent-color: #f26550; }
</style>
</head>
<body>
<div id="controls">
  <label>color <input type="color" id="col" value="#f26550"></label>
  <label>size <input type="range" id="size" min="0.01" max="0.2" step="0.005" value="0.14"> <span id="sizeV">0.140</span></label>
  <label>count <input type="range" id="count" min="0" max="200" step="1" value="56"> <span id="countV">56</span></label>
  <label>density <input type="range" id="interval" min="0.1" max="2" step="0.05" value="0.65"> <span id="intervalV">0.65s</span></label>
  <label>radius <input type="range" id="radius" min="0.1" max="2" step="0.05" value="0.75"> <span id="radiusV">0.75</span></label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
<script src="fireflies.js"></script>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
  camera.position.set(0, 0, 2.8);

  const clock = new THREE.Clock();
  let fireflies = null;

  function rebuild(opts) {
    if (fireflies) { scene.remove(fireflies.group); fireflies.dispose(); }
    fireflies = createFireflies(THREE, opts);
    scene.add(fireflies.group);
  }

  rebuild({ color: 0xf26550, size: 0.14 });

  // controls
  const colInput      = document.getElementById('col');
  const sizeInput     = document.getElementById('size');
  const countInput    = document.getElementById('count');
  const intervalInput = document.getElementById('interval');
  const radiusInput   = document.getElementById('radius');

  function currentOpts() {
    return {
      color:         colInput.value,
      size:          +sizeInput.value,
      count:         +countInput.value,
      spawnInterval: +intervalInput.value,
      radius:        +radiusInput.value,
    };
  }

  colInput.addEventListener('input', () => rebuild(currentOpts()));
  sizeInput.addEventListener('input', () => {
    document.getElementById('sizeV').textContent = (+sizeInput.value).toFixed(3);
    rebuild(currentOpts());
  });
  countInput.addEventListener('input', () => {
    document.getElementById('countV').textContent = countInput.value;
    rebuild(currentOpts());
  });
  intervalInput.addEventListener('input', () => {
    document.getElementById('intervalV').textContent = (+intervalInput.value).toFixed(2) + 's';
    rebuild(currentOpts());
  });
  radiusInput.addEventListener('input', () => {
    document.getElementById('radiusV').textContent = (+radiusInput.value).toFixed(2);
    rebuild(currentOpts());
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function animate() {
    requestAnimationFrame(animate);
    if (fireflies) fireflies.update(clock.getElapsedTime());
    renderer.render(scene, camera);
  })();
</script>
</body>
</html>
